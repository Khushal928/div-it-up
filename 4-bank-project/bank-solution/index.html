<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank App</title>
  <script src="app.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="header">Bank App</h1>
  <div id="app">Loading...</div>

  <template id="credits">
    <h1>Bank App</h1>
    <a href="/login" onclick="onLinkClick(event)">Login</a>
    <h2>Credits</h2>
    <p>microsoft</p>
    <p>amfoss</p>
  </template>

  <template id="dashboard">
    <header>
      <h2>Dashboard</h2> 
      <a href="/login" id="stylelink1" onclick="onLinkClick(event)">Logout</a>
    </header>
    <section>
      Balance: <span id="balance"></span><span id="currency"></span>
    </section>
    <h2 id="description"></h2>
    <section>
      <a id="addTransactionButton" href="/addTransaction" onclick="onLinkClick()">Add Transaction</a>
    </section>
    <h2>Transactions</h2>
    <table id="Transactionstable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Object</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="transactions"></tbody>
    </table>
  </template>

  <template id="login">
    <h2 id="Login1">Login</h2>
    <section>
    </section>
    <section>
      <form id="loginForm" action="javascript:login()">
        <label for="username">Username</label>
        <input id="username" name="user" type="text">
        <div id="loginError" role="alert"></div>
        <button id="button1">Login</button>
      </form>
      <hr/>
      <h2>Register</h2>
      <form id="registerForm" action="javascript:register()" method="POST">
        <label for="user">Username</label>
        <input id="user" name="user" type="text" maxlength="20" required>
        <label for="currency">Currency</label>
        <input id="currency" name="currency" type="text" value="$" maxlength="5" required>
        <label for="description">Description</label>
        <input id="description" name="description" type="text" maxlength="100">
        <label for="balance">Current balance</label>
        <input id="balance" name="balance" type="number" value="0">
        <div id="RegisterError" role="alert"></div>
        <button id="button1">Register</button>
      </form>
      <a href="/credits" id='stylelink' onclick="onLinkClick(event)">Credits</a>
    </section>
  </template>

  <template id="transaction">
    <tr>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </template>

  <template id="addTransaction">
    <h2>Add Transaction</h2>
    <form id="addTransactionForm" action="javascript:addTransaction()">
      <label for="date">Date</label>
      <input id="date" name="date" type="date" required>
      <label for="object">Object</label>
      <input id="object" name="object" type="text" required>
      <label for="amount">Amount</label>
      <input id="amount" name="amount" type="number" required>
      <button id="button2">Add</button>
      <p id="addTransactionError"></p>
    </form>
  </template>
</body>
</html>
